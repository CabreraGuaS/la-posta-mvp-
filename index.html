 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Posta - MVP Integrado</title>
    <!-- React 18 & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel Standalone para transformar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }

        /* Floating animations for Welcome Screen */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .animate-float-delayed { animation: float 5s ease-in-out infinite 1s; }
        .animate-float-slow { animation: float 6s ease-in-out infinite 2s; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LaPostaMVP = () => {
            const [currentPage, setCurrentPage] = useState('welcome');
            const [cart, setCart] = useState([]);
            const [savedCart, setSavedCart] = useState(null);
            const [userEmail, setUserEmail] = useState('');
            const [userName, setUserName] = useState('');
            const [hasMembership, setHasMembership] = useState(false);

            const [lastOrder, setLastOrder] = useState(null);
            const [addedNotification, setAddedNotification] = useState(null);

            const [orderPlaced, setOrderPlaced] = useState(false);
            const [generatedOrderNumber, setGeneratedOrderNumber] = useState('');
            const [address, setAddress] = useState('');
            const [paymentMethod, setPaymentMethod] = useState('mercadopago');
            const [selectedDeliveryDate, setSelectedDeliveryDate] = useState('');
            const [selectedTimeSlot, setSelectedTimeSlot] = useState('09:00 - 13:00');
            const [deliveryNotes, setDeliveryNotes] = useState('');
            
            const MIN_PURCHASE = 90000;

            useEffect(() => {
                if (addedNotification) {
                    const timer = setTimeout(() => {
                        setAddedNotification(null);
                    }, 6000);
                    return () => clearTimeout(timer);
                }
            }, [addedNotification]);

            const getMinDeliveryDate = () => {
                const date = new Date();
                let addedDays = 0;
                while (addedDays < 3) {
                    date.setDate(date.getDate() + 1);
                    if (date.getDay() !== 0 && date.getDay() !== 6) {
                        addedDays++;
                    }
                }
                return date.toISOString().split('T')[0];
            };

            const minDateStr = getMinDeliveryDate();

            // Catálogo actualizado desde el Excel
            const products = {
                harinas: [
                    { id: 'h1', name: 'Premezcla Universal x500g', category: 'Harinas', price: 3127, image: '🌾', brand: 'Doña Pacha', composition: 'Harinas y Premezclas', certified: true, stock: 15 },
                    { id: 'h2', name: 'Premezcla Universal x500g', category: 'Harinas', price: 3166, image: '🌾', brand: 'YAMAY', composition: 'Harinas y Premezclas', certified: true, stock: 10 },
                    { id: 'h3', name: 'Harina Integral Porotos Mung x400g', category: 'Harinas', price: 1879, image: '🫘', brand: 'Molino de Piedras', composition: 'Harinas y Premezclas', certified: true, stock: 20 },
                    { id: 'h4', name: 'Premezcla Cookies Nutritivas x200g', category: 'Harinas', price: 10784, image: '🍪', brand: 'EMM', composition: 'Harinas y Premezclas', certified: true, stock: 5 },
                ],
                pastas: [
                    { id: 'p1', name: 'Fideos Tirabuzón de Quinoa x250g', category: 'Pastas', price: 4282, image: '🍝', brand: 'Tratenfú', composition: 'Fideos y Pastas', certified: true, stock: 12 },
                    { id: 'p2', name: 'Fideos Spaghettis de Maíz x250g', category: 'Pastas', price: 4282, image: '🍝', brand: 'Tratenfú', composition: 'Fideos y Pastas', certified: true, stock: 15 },
                    { id: 'p3', name: 'Tirabuzones al Huevo x300g', category: 'Pastas', price: 3171, image: '🍝', brand: 'El Colono', composition: 'Fideos y Pastas', certified: true, stock: 18 },
                    { id: 'p4', name: 'Tapas para Lasagna', category: 'Pastas', price: 4005, image: '🥟', brand: 'Teramo', composition: 'Fideos y Pastas', certified: true, stock: 8 },
                ],
                legumbres: [
                    { id: 'l1', name: 'Porotos Alubia x600g', category: 'Legumbres', price: 3170, image: '🫘', brand: 'Grano Pampa', composition: 'Legumbres y Cereales', certified: true, stock: 25 },
                    { id: 'l2', name: 'Garbanzos x600g', category: 'Legumbres', price: 3139, image: '🥙', brand: 'Grano Pampa', composition: 'Legumbres y Cereales', certified: true, stock: 20 },
                ],
                snacks: [
                    { id: 's1', name: 'Galletitas Choco y Dulce de Leche x125g', category: 'Snacks', price: 2008, image: '🍪', brand: 'Praat', composition: 'Galletitas y Snacks', certified: true, stock: 14 },
                    { id: 's2', name: 'Galletas Arroz Bañadas Choco x99g', category: 'Snacks', price: 2276, image: '🍘', brand: 'Genérico', composition: 'Galletitas y Snacks', certified: true, stock: 30 },
                    { id: 's3', name: 'Snack Crunchy Corn Sal Marina x35g', category: 'Snacks', price: 853, image: '🍿', brand: 'Lennys', composition: 'Galletitas y Snacks', certified: true, stock: 40 },
                    { id: 's4', name: 'Super Mix Brownies Chocolate x425g', category: 'Snacks', price: 3949, image: '🍫', brand: 'Gula', composition: 'Galletitas y Snacks', certified: true, stock: 10 },
                ],
                almacen: [
                    { id: 'a1', name: 'Edulcorante Dietético Clásico x500cc', category: 'Almacén', price: 2719, image: '☕', brand: 'Cuarto Creciente', composition: 'Endulzantes', certified: true, stock: 12 },
                    { id: 'a2', name: 'Stevia Premium sin Sucralosa x100cc', category: 'Almacén', price: 5841, image: '🌿', brand: 'Trever', composition: 'Endulzantes', certified: true, stock: 8 },
                    { id: 'a3', name: 'Aceite de Salvado de Arroz x900cc', category: 'Almacén', price: 8723, image: '🫒', brand: 'Blue Patna', composition: 'Aceites', certified: true, stock: 6 },
                    { id: 'a4', name: 'Pan Rallado x500g', category: 'Almacén', price: 5316, image: '🥖', brand: 'Inti Pan', composition: 'Rebozadores', certified: true, stock: 15 },
                    { id: 'a5', name: 'Rebozador sin gluten x500g', category: 'Almacén', price: 3635, image: '🥖', brand: 'Doña Pacha', composition: 'Rebozadores', certified: true, stock: 20 },
                    { id: 'a6', name: 'Vegetales Deshidratados Pascualinas x120g', category: 'Almacén', price: 3053, image: '🥗', brand: 'Genérico', composition: 'Almacén', certified: true, stock: 10 },
                    { id: 'a7', name: 'Mermelada de Ciruela Light x330g', category: 'Almacén', price: 5079, image: '🍯', brand: 'La Tranquilina', composition: 'Dulces y Mermeladas', certified: true, stock: 14 },
                ]
            };

            const allProducts = Object.values(products).flat();

            const communityRecipes = [
                {
                    id: 'rec1',
                    title: '🍝 Fideos de Quinoa con Vegetales',
                    image: '🍝',
                    time: '20 minutos',
                    servings: '2 porciones',
                    ingredients: [
                        { text: '1 paquete de Fideos Tirabuzón de Quinoa', productId: 'p1' },
                        { text: 'Mezcla de Vegetales Deshidratados', productId: 'a6' },
                        { text: '2 cucharadas de Aceite de Salvado de Arroz', productId: 'a3' },
                        { text: 'Sal y especias a gusto' }
                    ],
                    steps: [
                        'Hervir los fideos de quinoa según las indicaciones del paquete.',
                        'Hidratar la mezcla de vegetales deshidratados en agua tibia.',
                        'Saltear los vegetales en una sartén con el aceite de arroz.',
                        'Mezclar los fideos con el salteado y condimentar.'
                    ],
                    tip: 'Podés sumar queso rallado sin gluten o semillas tostadas.'
                },
                {
                    id: 'rec2',
                    title: '🥞 Panqueques sin gluten',
                    image: '🥞',
                    time: '15 minutos',
                    servings: '2 porciones',
                    ingredients: [
                        { text: '1 taza de Premezcla Universal', productId: 'h1' },
                        { text: '2 huevos' },
                        { text: 'Chorrito de Stevia Premium', productId: 'a2' },
                        { text: 'Esencia de vainilla y leche' }
                    ],
                    steps: [
                        'Licuar todos los ingredientes hasta obtener una mezcla homogénea.',
                        'Calentar una sartén antiadherente apenas aceitada.',
                        'Cocinar pequeñas porciones durante 2 minutos por lado.',
                        'Servir con mermelada o dulce de leche.'
                    ],
                    tip: 'Ideal para desayuno o merienda escolar.'
                }
            ];

            useEffect(() => {
                try {
                    const savedUser = localStorage.getItem('lapostaUser');
                    const savedUserName = localStorage.getItem('lapostaUserName');
                    const savedMembership = localStorage.getItem('lapostaMembership');
                    
                    if (savedUser) {
                        setUserEmail(savedUser);
                        const savedCartData = localStorage.getItem(`lapostaCart_${savedUser}`);
                        if (savedCartData) setSavedCart(JSON.parse(savedCartData));

                        const savedLastOrder = localStorage.getItem(`lapostaLastOrder_${savedUser}`);
                        if (savedLastOrder) setLastOrder(JSON.parse(savedLastOrder));
                    }
                    if (savedUserName) setUserName(savedUserName);
                    if (savedMembership) setHasMembership(JSON.parse(savedMembership));
                } catch (e) {
                    console.error("Error al cargar de localStorage", e);
                }
            }, []);

            const calculatePrice = (product, quantity = 1) => {
                let price = product.price;
                if (hasMembership) {
                    price = price * 0.9;
                }
                if (quantity > 3) {
                    price = price * 0.95;
                }
                return Math.round(price);
            };

            const calculateCartTotal = () => {
                let subtotal = 0;
                let totalItems = 0;
                
                cart.forEach(item => {
                    const qty = item.quantity || 1;
                    totalItems += qty;
                    const unitPrice = calculatePrice(item, qty);
                    subtotal += unitPrice * qty;
                });

                const shipping = hasMembership ? 0 : 3500;
                const total = subtotal + (totalItems > 0 ? shipping : 0);

                return { subtotal, total, shipping, totalItems };
            };

            const generateOrderNumber = () => {
                const timestamp = Date.now().toString().slice(-6);
                const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
                return `LP-${timestamp}-${random}`;
            };

            const cartSummary = calculateCartTotal();

            const isValidEmail = (email) => {
                return email.includes('@') && email.includes('.');
            };

            const updateProductQuantity = (product, newQty) => {
                const existingIndex = cart.findIndex(p => p.id === product.id);
                if (newQty <= 0) {
                    setCart(cart.filter(p => p.id !== product.id));
                } else if (existingIndex >= 0) {
                    const updated = [...cart];
                    updated[existingIndex].quantity = newQty;
                    setCart(updated);
                    if (newQty > (cart[existingIndex].quantity || 0)) {
                        setAddedNotification({ ...product, quantity: newQty });
                    }
                } else {
                    setCart([...cart, { ...product, quantity: newQty, cartId: Math.random() }]);
                    setAddedNotification({ ...product, quantity: newQty });
                }
            };

            const handleLogout = () => {
                if (confirm('¿Deseas salir y volver a la pantalla de inicio de sesión?')) {
                    setCurrentPage('welcome');
                    setUserEmail('');
                    setUserName('');
                    setCart([]);
                    localStorage.removeItem('lapostaUser');
                    localStorage.removeItem('lapostaUserName');
                }
            };

            // 1. WELCOME (Combinación SideChef + Talabat)
            const renderWelcomePage = () => (
                <div className="min-h-screen bg-[#FDF9F1] relative flex flex-col justify-between max-w-md mx-auto overflow-hidden">
                    {/* Sección Superior: Ilustración y Logo */}
                    <div className="relative h-[55vh] w-full flex items-center justify-center">
                        {/* Emojis flotantes imitando los ingredientes cayendo y flotando */}
                        <div className="absolute top-10 left-8 text-5xl transform -rotate-12 animate-float">🍞</div>
                        <div className="absolute top-16 right-10 text-4xl transform rotate-12 animate-float-delayed">🥑</div>
                        <div className="absolute bottom-20 left-10 text-5xl transform rotate-6 animate-float-slow">🍝</div>
                        <div className="absolute bottom-24 right-12 text-4xl transform -rotate-12 animate-float">🥫</div>
                        <div className="absolute top-1/3 left-4 text-3xl animate-float-delayed">🥚</div>
                        <div className="absolute top-1/4 right-6 text-3xl animate-float-slow">🥦</div>
                        <div className="absolute bottom-12 left-1/3 text-4xl transform -rotate-6 animate-float">🍪</div>

                        {/* Canasta de fondo */}
                        <div className="absolute bottom-8 text-[9rem] z-0 opacity-60 transform translate-y-4">
                            🧺
                        </div>

                        {/* Cartel / Logo Central estilo Talabat */}
                        <div className="bg-amber-600 text-white text-4xl font-extrabold px-6 py-3 transform -rotate-3 shadow-xl z-10 border-2 border-amber-700">
                            La Posta
                        </div>
                    </div>

                    {/* Bottom Sheet: Formulario estilo Pill Buttons */}
                    <div className="bg-white rounded-t-[2.5rem] pt-8 pb-10 px-8 shadow-[0_-15px_40px_rgba(0,0,0,0.06)] z-20 flex flex-col w-full">
                        <div className="text-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-900 mb-2">¡Hola!</h2>
                            <p className="text-sm text-gray-500 px-4">Ingresá para armar tu lista de compras, acceder a precios mayoristas y no olvidar ningún ingrediente.</p>
                        </div>

                        <div className="space-y-3 mb-6">
                            <div className="relative">
                                <span className="absolute left-4 top-3.5 text-gray-400">✉️</span>
                                <input
                                    type="email"
                                    placeholder="Continuar con Email"
                                    value={userEmail}
                                    onChange={(e) => setUserEmail(e.target.value)}
                                    className="w-full pl-11 pr-5 py-3.5 border-2 border-gray-200 rounded-full text-sm font-semibold text-gray-800 focus:outline-none focus:border-amber-500 bg-white transition placeholder-gray-500"
                                />
                            </div>
                            <div className="relative">
                                <span className="absolute left-4 top-3.5 text-gray-400">👤</span>
                                <input
                                    type="text"
                                    placeholder="Tu Nombre (Opcional)"
                                    value={userName}
                                    onChange={(e) => setUserName(e.target.value)}
                                    className="w-full pl-11 pr-5 py-3.5 border-2 border-gray-200 rounded-full text-sm font-semibold text-gray-800 focus:outline-none focus:border-amber-500 bg-white transition placeholder-gray-500"
                                />
                            </div>
                        </div>

                        <button
                            onClick={() => {
                                if (isValidEmail(userEmail)) {
                                    const cleanEmail = userEmail.trim().toLowerCase();
                                    const displayName = userName.trim() || cleanEmail.split('@')[0];
                                    
                                    setUserEmail(cleanEmail);
                                    setUserName(displayName);

                                    localStorage.setItem('lapostaUser', cleanEmail);
                                    localStorage.setItem('lapostaUserName', displayName);

                                    const saved = localStorage.getItem(`lapostaCart_${cleanEmail}`);
                                    if (saved) setSavedCart(JSON.parse(saved));

                                    const savedOrder = localStorage.getItem(`lapostaLastOrder_${cleanEmail}`);
                                    if (savedOrder) setLastOrder(JSON.parse(savedOrder));

                                    setCurrentPage('membership');
                                }
                            }}
                            disabled={!isValidEmail(userEmail)}
                            className="w-full bg-black text-white py-4 rounded-full font-bold text-sm disabled:opacity-40 disabled:bg-gray-400 hover:bg-gray-800 transition shadow-lg mt-2 tracking-wide"
                        >
                            SIGUIENTE
                        </button>
                    </div>
                </div>
            );

            // 2. MEMBERSHIP
            const renderMembershipPage = () => (
                <div className="min-h-screen bg-gradient-to-b from-[#FDF9F1] to-white p-6 max-w-md mx-auto flex flex-col justify-between">
                    <div className="pt-4 space-y-4">
                        <div className="text-center mb-6">
                            <h2 className="text-3xl font-extrabold text-amber-900 mb-1">¡Qué bueno verte! 👋</h2>
                            <p className="text-sm text-amber-700">{userName || userEmail}</p>
                        </div>

                        <h2 className="text-md font-bold text-gray-800 px-1">Seleccioná tu plan para continuar:</h2>
                        
                        <div className="space-y-4">
                            <div 
                                onClick={() => {
                                    setHasMembership(false);
                                    localStorage.setItem('lapostaMembership', 'false');
                                    setCurrentPage('home');
                                }}
                                className="bg-white p-6 rounded-3xl border-2 border-gray-200 cursor-pointer hover:border-amber-500 transition shadow-sm space-y-2"
                            >
                                <p className="font-bold text-lg text-gray-800">Plan Estándar</p>
                                <p className="text-xs text-gray-600 mb-2">Ideal para compras ocasionales</p>
                                <ul className="text-sm space-y-1.5 text-gray-600 pt-2 border-t border-gray-100">
                                    <li>✓ Acceso a catálogo 100% sin gluten</li>
                                    <li>✓ Envío estándar: $3500</li>
                                    <li>✗ Sin descuentos especiales</li>
                                </ul>
                                <button className="w-full bg-gray-100 text-gray-800 py-3 rounded-full font-bold text-sm mt-4 hover:bg-gray-200 transition">
                                    Empezar sin membresía
                                </button>
                            </div>

                            <div 
                                onClick={() => {
                                    setHasMembership(true);
                                    localStorage.setItem('lapostaMembership', 'true');
                                    setCurrentPage('home');
                                }}
                                className="bg-gradient-to-br from-amber-500 to-amber-600 p-6 rounded-3xl cursor-pointer hover:shadow-xl transition relative space-y-2 shadow-lg"
                            >
                                <span className="absolute -top-3 right-6 bg-black text-white text-[10px] px-3 py-1 rounded-full font-bold tracking-widest uppercase">Mejor Opción</span>
                                <p className="font-bold text-lg text-white">Membresía Mensual ✨</p>
                                <p className="text-2xl font-black text-white">10% OFF en todo</p>
                                <ul className="text-sm space-y-1.5 text-amber-50 pt-2 border-t border-amber-400/50">
                                    <li>✓ <strong>10% OFF</strong> en todo el catálogo</li>
                                    <li>✓ <strong>+5% EXTRA</strong> llevando más de 3 uds.</li>
                                    <li>✓ <strong>Envío GRATIS</strong> en tus compras</li>
                                </ul>
                                <button className="w-full bg-white text-amber-700 py-3 rounded-full font-black text-sm hover:bg-amber-50 transition mt-4 shadow">
                                    Activar membresía
                                </button>
                            </div>
                        </div>
                    </div>

                    <button 
                        onClick={handleLogout}
                        className="text-sm text-gray-500 text-center font-semibold py-4 hover:text-red-600"
                    >
                        Salir o Cambiar usuario
                    </button>
                </div>
            );

            // 3. HOME
            const renderHomePage = () => (
                <div className="min-h-screen bg-gray-50 pb-20">
                    <div className="bg-amber-600 text-white p-4 sticky top-0 z-10 shadow-md">
                        <div className="flex justify-between items-center mb-1 max-w-md mx-auto">
                            <h1 className="text-2xl font-extrabold flex items-center gap-2">
                                La Posta
                            </h1>
                            <div className="flex items-center gap-4">
                                <button onClick={() => setCurrentPage('cart')} className="text-2xl relative">
                                    🛒
                                    {cart.length > 0 && (
                                        <span className="absolute -top-1 -right-2 bg-black text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold border-2 border-amber-600">
                                            {cartSummary.totalItems}
                                        </span>
                                    )}
                                </button>
                                <button 
                                    onClick={handleLogout} 
                                    className="text-xl hover:bg-amber-700 p-1.5 rounded-full transition"
                                >
                                    🚪
                                </button>
                            </div>
                        </div>
                        <div className="flex justify-between text-[11px] text-amber-100 max-w-md mx-auto px-1">
                            <span>{userName || userEmail}</span>
                            <span className="font-bold">{hasMembership ? '⭐ Socio (10% OFF)' : '👤 Estándar'}</span>
                        </div>
                    </div>

                    <div className="bg-white border-b border-amber-200 p-3 shadow-sm">
                        <div className="flex items-center gap-2 max-w-md mx-auto text-xs text-gray-700 font-medium">
                            <span className="text-green-600 text-base">✓</span>
                            <span>Catálogo 100% certificado sin gluten (SENASA)</span>
                        </div>
                    </div>

                    <div className="p-4 space-y-6 max-w-md mx-auto">
                        {Object.entries({
                            'Harinas y Premezclas': products.harinas,
                            'Pastas': products.pastas,
                            'Legumbres y Cereales': products.legumbres,
                            'Snacks y Galletitas': products.snacks,
                            'Almacén, Aceites y Endulzantes': products.almacen
                        }).map(([category, items]) => (
                            <div key={category}>
                                <h3 className="text-sm font-bold text-gray-900 mb-3 uppercase tracking-wide">{category}</h3>
                                <div className="space-y-3">
                                    {items.map(product => {
                                        const inCart = cart.find(p => p.id === product.id);
                                        const qty = inCart ? (inCart.quantity || 1) : 0;
                                        const pricePerUnit = calculatePrice(product, qty || 1);
                                        
                                        return (
                                            <div
                                                key={product.id}
                                                className="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition"
                                            >
                                                <div className="flex justify-between items-start gap-2">
                                                    <div className="flex items-start gap-3 flex-1 cursor-pointer" onClick={() => setCurrentPage(`product-${product.id}`)}>
                                                        <span className="text-4xl bg-gray-50 p-2 rounded-xl">{product.image}</span>
                                                        <div>
                                                            <span className="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold uppercase">{product.brand}</span>
                                                            <p className="font-bold text-sm text-gray-800 mt-1 leading-tight">{product.name}</p>
                                                            <p className="text-sm font-black text-amber-600 mt-1">${pricePerUnit.toLocaleString('es-AR')}</p>
                                                        </div>
                                                    </div>

                                                    <div className="flex flex-col items-end gap-3 justify-between h-full">
                                                        <button
                                                            onClick={() => setCurrentPage(`product-${product.id}`)}
                                                            className="text-[11px] text-gray-400 font-semibold hover:text-amber-600"
                                                        >
                                                            Detalles
                                                        </button>

                                                        {qty === 0 ? (
                                                            <button
                                                                onClick={() => updateProductQuantity(product, 1)}
                                                                className="bg-black text-white px-4 py-2 rounded-full text-xs font-bold hover:bg-gray-800 transition shadow-md"
                                                            >
                                                                + Agregar
                                                            </button>
                                                        ) : (
                                                            <div className="flex items-center gap-2 bg-gray-100 p-1 rounded-full border border-gray-200">
                                                                <button
                                                                    onClick={() => updateProductQuantity(product, qty - 1)}
                                                                    className="w-7 h-7 bg-white text-gray-800 rounded-full font-bold shadow-sm flex items-center justify-center text-sm"
                                                                >
                                                                    −
                                                                </button>
                                                                <span className="text-xs font-bold text-gray-900 min-w-[16px] text-center">{qty}</span>
                                                                <button
                                                                    onClick={() => updateProductQuantity(product, qty + 1)}
