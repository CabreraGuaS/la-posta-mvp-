                        { text: '1 Premezcla para Cookies x200g', productId: 'p4' },
                        { text: '2 huevos' },
                        { text: '50g de manteca o aceite de coco' },

                    steps: [

                        'Dejar enfriar antes de consumir.'

            useEffect(() => {
                try {
                    const savedUser = localStorage.getItem('lapostaUser');
                    const savedUserName = localStorage.getItem('lapostaUserName');
                    const savedMembership = localStorage.getItem('lapostaMembership');
                    
                    if (savedUser) {
                        setUserEmail(savedUser);
                        const savedCartData = localStorage.getItem(`lapostaCart_${savedUser}`);
                        if (savedCartData) setCart(JSON.parse(savedCartData));

                        const savedLastOrder = localStorage.getItem(`lapostaLastOrder_${savedUser}`);
                        if (savedLastOrder) setLastOrder(JSON.parse(savedLastOrder));
                    }
                    if (savedUserName) setUserName(savedUserName);
                    if (savedMembership) setHasMembership(JSON.parse(savedMembership));
                } catch (e) {
                    console.error("Error al cargar de localStorage", e);
                }
            }, []);

            const calculatePrice = (product, quantity = 1) => {
                let price = product.price;
                if (hasMembership) price = price * 0.9;
                if (quantity > 3) price = price * 0.95;
                return Math.round(price);
            };

            const calculateCartTotal = () => {
                let subtotal = 0;
                let totalItems = 0;
                
                cart.forEach(item => {
                    const qty = item.quantity || 1;
                    totalItems += qty;
                    const unitPrice = calculatePrice(item, qty);
                    subtotal += unitPrice * qty;
                });

                let shipping = 0;
                if (subtotal > 0 && subtotal < 100000) {
                    shipping = 9000;
                }
                
                if (hasMembership) shipping = 0;

                const total = subtotal + shipping;

                return { subtotal, total, shipping, totalItems };
            };

            const generateOrderNumber = () => {
                const timestamp = Date.now().toString().slice(-6);
                const random = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
                return `LP-${timestamp}-${random}`;
            };

            const cartSummary = calculateCartTotal();
            const MIN_ORDER = 90000;
            const minOrderMet = cartSummary.subtotal >= MIN_ORDER;

            const isValidEmail = (email) => email.includes('@') && email.includes('.');

            const toggleWishlist = (id) => {
                if (wishlist.includes(id)) {
                    setWishlist(wishlist.filter(w => w !== id));
                } else {
                    setWishlist([...wishlist, id]);
                }
            };

            const updateProductQuantity = (product, newQty) => {
                const existingIndex = cart.findIndex(p => p.id === product.id);
                if (newQty <= 0) {
                    setCart(cart.filter(p => p.id !== product.id));
                } else if (existingIndex >= 0) {
                    const updated = [...cart];
                    updated[existingIndex].quantity = newQty;
                    setCart(updated);
                    if (newQty > (cart[existingIndex].quantity || 0)) {
                        setAddedNotification({ ...product, quantity: newQty });
                    }
                } else {
                    setCart([...cart, { ...product, quantity: newQty, cartId: Math.random() }]);
                    setAddedNotification({ ...product, quantity: newQty });
                }
            };

            const handleLogout = () => {
                if (confirm('¿Deseas salir y volver a la pantalla de inicio de sesión?')) {
                    setCurrentPage('welcome');
                    setUserEmail('');
                    setUserName('');
                    setCart([]);
                    localStorage.removeItem('lapostaUser');
                    localStorage.removeItem('lapostaUserName');

            };

                    <button onClick={() => setCurrentPage('cart')} className={`flex flex-col items-center px-3 py-1.5 rounded-2xl transition-all relative ${active === 'cart' ? 'text-amber-800 bg-amber-50 font-extrabold shadow-xs' : 'text-gray-400 font-semibold hover:text-gray-600'}`}>
                        <span className="text-lg mb-0.5">🛒</span>
                        {cartSummary.totalItems > 0 && <span className="absolute top-1 right-2 bg-red-500 text-white text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-extrabold shadow-xs">{cartSummary.totalItems}</span>}
                        <span className="text-[10px]">Carrito</span>
                    </button>
                    <button onClick={() => setCurrentPage('profile')} className={`flex flex-col items-center px-3 py-1.5 rounded-2xl transition-all ${active === 'profile' ? 'text-amber-800 bg-amber-50 font-extrabold shadow-xs' : 'text-gray-400 font-semibold hover:text-gray-600'}`}>
                        <span className="text-lg mb-0.5">👤</span>
                        <span className="text-[10px]">Perfil</span>
                    </button>
                    <button onClick={handleLogout} className="flex flex-col items-center px-3 py-1.5 rounded-2xl transition-all text-gray-400 font-semibold hover:text-red-600">
                        <span className="text-lg mb-0.5">🚪</span>
                        <span className="text-[10px]">Salir</span>
                    </button>
                </div>
            );

            return (
                <div className="relative min-h-screen bg-slate-50">
                    {currentPage === 'welcome' && renderWelcomePage()}
                    {currentPage === 'membership' && renderMembershipPage()}
                    {currentPage === 'home' && renderHomePage()}
                    {currentPage === 'cart' && renderCartPage()}
                    {currentPage === 'checkout' && renderCheckoutPage()}
                    {currentPage === 'community' && renderCommunityPage()}
                    {currentPage === 'profile' && renderProfilePage()}
                    {currentPage.startsWith('product-') && renderProductPage(currentPage.replace('product-', ''))}
                    
                    {/* NOTIFICACIÓN FLOTANTE */}
                    {addedNotification && (
                        <div className="fixed bottom-24 left-4 right-4 z-50 animate-slide-up max-w-md mx-auto">
                            <div className="bg-gray-900/95 backdrop-blur-md text-white p-3.5 rounded-3xl shadow-2xl flex items-center justify-between gap-3 border border-gray-800">
                                <div className="flex items-center gap-3 overflow-hidden pl-1">
                                    <span className="text-2xl flex-shrink-0 bg-gray-800 p-2 rounded-2xl">{addedNotification.image}</span>
                                    <div className="truncate">
                                        <p className="text-[9px] text-amber-400 font-extrabold uppercase tracking-wider">¡Agregado!</p>
                                        <p className="text-xs font-bold truncate text-white">{addedNotification.name}</p>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2 flex-shrink-0 pr-1">
                                    <button
                                        onClick={() => { setAddedNotification(null); setCurrentPage('cart'); }}
                                        className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3.5 py-2 rounded-2xl transition shadow-md whitespace-nowrap"
                                    >
                                        Ir a Pagar →
                                    </button>
                                    <button onClick={() => setAddedNotification(null)} className="text-gray-400 hover:text-white p-1 text-sm font-bold">✕</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<LaPostaMVP />);
    </script>
</body>
</html>
